<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASB Ventures — STEM Venture Capital</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --paper:#0F0F0E;        /* dark base */
    --paper-2:#17171A;
    --ink:#F5E9C8;          /* warm ivory type */
    --ink-2:#C9BFA3;
    --muted:#7A7363;
    --rule:#2A2925;
    --rule-soft:#1E1D1A;
    --yellow:#FDD100;       /* ASBV yellow (from crest) */
    --yellow-2:#E6C048;     /* softer gold */
    --accent:#FDD100;
    --accent-2:#8A6A1F;
    --accent-ink:#FDD100;   /* accent when used as TEXT on paper — same as yellow in dark */
    --accent-ink-soft:#E6C048;
    --gold:#E6C048;
    --deep:#08080A;         /* deeper panels — footer, map bg */
    --on-yellow:#0F0F0E;    /* text color over yellow */
    --faded:#6A6555;        /* tertiary text e.g. copyright */
    --yellow-soft:rgba(253,209,0,0.12);
    --yellow-grid:rgba(253,209,0,0.08);
    --card:#17171A;
    --card-hover:#1C1C20;
  }
  body.light{
    --paper:#E8DFCB;        /* sand */
    --paper-2:#EFE7D3;      /* lighter sand card */
    --ink:#1A1712;          /* near-black warm */
    --ink-2:#2E281F;        /* darker for body contrast */
    --muted:#6E6450;        /* darker muted */
    --rule:#C7BDA4;
    --rule-soft:#D9CFB5;
    --accent-2:#5A3E0A;
    --deep:#DDD3B9;
    --faded:#7A6E54;
    --yellow-soft:rgba(253,209,0,0.22);
    --yellow-grid:rgba(122,78,10,0.14);
    --card:#EFE7D3;
    --card-hover:#E3D9BF;
    /* Light mode: keep crest yellow as FILL; accent TEXT is deep ink, highlighted yellow behind key words */
    --yellow:#FDD100;
    --yellow-2:#E6C048;
    --accent:#FDD100;
    --accent-ink:#1A1712;
    --accent-ink-soft:#3A2E1A;
  }
  /* Yellow-highlight marker on italic accent words in light mode */
  body.light .hl,
  body.light h1 em,
  body.light h2 em,
  body.light h3 em,
  body.light .hero h1 em,
  body.light .hero h1 .amp,
  body.light .section-hd h2 em,
  body.light blockquote em{
    color:#1A1712 !important;
    background:linear-gradient(180deg, transparent 0 52%, #FDD100 52% 94%, transparent 94%);
    padding:0 .08em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
    border-radius:2px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
  body{font-size:15px;line-height:1.55;letter-spacing:-0.005em}
  a{color:inherit;text-decoration:none}
  .serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-0.01em}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-ligatures:none}
  /* Chinese-mode typography */
  body.zh{font-family:'Noto Sans SC','Inter Tight',system-ui,sans-serif;letter-spacing:0}
  body.zh h1,body.zh h2,body.zh h3,body.zh h4,body.zh h5,body.zh .serif,body.zh blockquote{font-family:'Noto Serif SC','Instrument Serif',serif;letter-spacing:0;font-weight:500}
  body.zh h1 em,body.zh h2 em,body.zh h3 em,body.zh .serif em{font-style:normal;color:var(--accent-ink)}
  body.zh .mono,body.zh .eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
  .rule{height:1px;background:var(--rule)}
  .rule-soft{height:1px;background:var(--rule-soft)}
  .container{max-width:1360px;margin:0 auto;padding:0 32px}
  @media (max-width:720px){.container{padding:0 20px}}
  /* grain */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.22;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.8 0 0 0 0 0.3 0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* no outline on clicks */
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

  /* TICKER */
  .ticker{background:var(--yellow);color:var(--on-yellow);font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.06em;overflow:hidden;border-bottom:1px solid var(--accent-2);font-weight:500}
  .ticker-inner{display:flex;gap:56px;white-space:nowrap;animation:tick 90s linear infinite;padding:10px 0}
  .ticker span em{font-style:normal;color:#0A6B2E;margin-left:8px;font-weight:700}
  body.light .ticker span em{color:#0A6B2E}
  .ticker span .dn{color:#8A1F1F}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* NAV */
  .nav{position:sticky;top:0;z-index:50;background:var(--paper);backdrop-filter:saturate(1.2);border-bottom:1px solid var(--rule);transition:box-shadow .2s,background .2s}
  .nav.scrolled{background:color-mix(in oklab, var(--paper) 92%, transparent);box-shadow:0 1px 0 var(--yellow-soft)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:76px}
  .logo{display:flex;align-items:center;gap:14px}
  .logo-mark{width:46px;height:46px;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
  .logo-mark img{width:100%;height:100%;object-fit:contain;display:block}
  .logo-wm{font-family:'Instrument Serif',serif;font-size:22px;letter-spacing:-0.01em;line-height:1;color:var(--accent-ink)}
  .logo-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
  .nav-links{display:flex;gap:30px;align-items:center}
  .nav-links a{font-size:13.5px;color:var(--ink-2);letter-spacing:-0.005em;position:relative;padding:26px 0;cursor:pointer}
  .nav-links a:hover{color:var(--accent-ink)}
  .nav-links a.has-menu::after{content:"";display:inline-block;width:5px;height:5px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);margin-left:6px;vertical-align:middle}
  .nav-cta{display:flex;gap:10px;align-items:center}
  .pill{border:1px solid var(--accent-ink);padding:9px 16px;font-size:12px;letter-spacing:0.02em;border-radius:999px;transition:background .15s,color .15s;cursor:pointer;background:transparent;color:var(--accent-ink)}
  .pill:hover{background:var(--accent-ink);color:var(--paper)}
  .pill.ghost{border-color:var(--rule);color:var(--ink-2)}
  .pill.ghost:hover{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}
  /* Light mode: keep yellow visible on pills, but use dark text for accent */
  body.light .pill{border-color:var(--ink);color:var(--ink)}
  body.light .pill:hover{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
  .lang{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em}
  .lang b{color:var(--accent-ink)}
  .lang-toggle{cursor:pointer;padding:8px 10px;border:1px solid var(--rule);border-radius:999px;background:transparent;transition:border-color .15s}
  .lang-toggle:hover{border-color:var(--accent-ink)}
  .lang-toggle b{color:var(--muted);font-weight:500;transition:color .15s}
  .lang-toggle b.on{color:var(--accent-ink);font-weight:700}
  .theme-toggle{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink-2);transition:border-color .15s,color .15s,transform .3s}
  .theme-toggle:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
  .theme-toggle svg{display:block;transition:transform .3s}
  .theme-toggle:hover svg{transform:rotate(-20deg)}
  .mega{position:absolute;left:0;right:0;top:100%;background:var(--paper-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden;transition:max-height .25s ease,opacity .2s ease;max-height:0;opacity:0}
  .mega.open{max-height:360px;opacity:1}
  .mega-grid{display:grid;grid-template-columns:1.2fr 2fr;gap:0;padding:32px 0 40px}
  .mega-left{padding-right:40px;border-right:1px solid var(--rule-soft)}
  .mega-left h4{font-family:'Instrument Serif',serif;font-size:28px;margin:0 0 8px;font-weight:400}
  .mega-left p{font-size:13px;color:var(--muted);margin:0;max-width:40ch}
  .mega-right{padding-left:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
  .mega-col h5{font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:500}
  .mega-col a{display:block;padding:8px 0;font-size:14px;border-bottom:1px solid var(--rule);color:var(--ink-2);transition:color .15s,padding .15s}
  .mega-col a:hover{color:var(--accent-ink);padding-left:8px}
  .mega-col a span{float:right;opacity:.4}

  /* HERO */
  .hero{padding:80px 0 90px;position:relative}
  .hero-grid{display:grid;grid-template-columns:1fr 420px;gap:64px;align-items:end}
  @media(max-width:1100px){.hero-grid{grid-template-columns:1fr}}
  .hero h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(56px,8.4vw,128px);line-height:0.94;letter-spacing:-0.025em;margin:0}
  .hero h1 em{font-style:italic;color:var(--accent-ink)}
  .hero h1 .amp{font-style:italic;color:var(--accent-ink);font-weight:400}
  .hero-meta{display:flex;gap:32px;margin-top:40px;padding-top:28px;border-top:1px solid var(--rule);flex-wrap:wrap}
  .hero-meta .item{display:flex;flex-direction:column;gap:4px}
  .hero-meta .item b{font-family:'Instrument Serif',serif;font-size:28px;font-weight:400;line-height:1}
  .hero-meta .item span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .hero-side{border-left:1px solid var(--rule);padding-left:32px;align-self:end}
  .hero-side .tag{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .hero-side .tag i{width:6px;height:6px;background:var(--yellow);border-radius:50%;display:inline-block;animation:pulse 2s infinite;box-shadow:0 0 0 4px var(--yellow-soft)}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .hero-side p{font-size:16px;line-height:1.55;color:var(--ink-2);margin:0 0 22px}
  .hero-side .sig{display:flex;gap:12px;align-items:center;padding-top:18px;border-top:1px solid var(--rule-soft)}
  .hero-side .sig .av{width:42px;height:42px;border-radius:50%;background-size:cover;background-position:center;border:1px solid var(--rule)}
  .hero-side .sig div small{display:block;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.08em}
  .hero-cta{display:flex;gap:14px;margin-top:22px}
  .btn-solid{background:var(--yellow);color:var(--on-yellow);padding:13px 22px;font-size:13px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,background .15s;font-weight:500}
  .btn-solid:hover{background:var(--yellow-2)}
  .btn-solid .arr{display:inline-block;transition:transform .2s}
  .btn-solid:hover .arr{transform:translateX(3px)}

  /* SECTION FRAME */
  .section{padding:90px 0;border-top:1px solid var(--rule)}
  .section-hd{display:grid;grid-template-columns:1.5fr 2fr;gap:48px;align-items:end;margin-bottom:56px}
  @media(max-width:900px){.section-hd{grid-template-columns:1fr;gap:24px}}
  .section-hd h2{font-family:'Instrument Serif',serif;font-size:clamp(40px,5vw,72px);line-height:0.98;letter-spacing:-0.02em;margin:0;font-weight:400}
  .section-hd h2 em{font-style:italic;color:var(--accent-ink)}
  .section-hd .right{font-size:16px;color:var(--ink-2);max-width:52ch;line-height:1.55}
  .section-hd .meta{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;display:flex;gap:14px;align-items:center}
  .section-hd .meta i{width:28px;height:1px;background:var(--yellow)}

  /* By the Numbers */
  .nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--yellow);border-bottom:1px solid var(--yellow);background:linear-gradient(180deg,rgba(253,209,0,0.04),transparent 70%)}
  @media(max-width:900px){.nums{grid-template-columns:repeat(2,1fr)}}
  .nums .cell{padding:36px 28px;border-right:1px solid var(--rule-soft);position:relative;overflow:hidden}
  .nums .cell:last-child{border-right:0}
  .nums .cell .k{font-family:'Instrument Serif',serif;font-size:72px;line-height:0.95;letter-spacing:-0.02em;font-weight:400}
  .nums .cell .k{color:var(--accent-ink)}
  .nums .cell .k sup{font-size:28px;vertical-align:top;display:inline-block;margin-left:2px;color:var(--ink-2);font-style:italic}
  .nums .cell .l{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:14px}
  .nums .cell .d{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.4}

  /* Sectors */
  .sectors{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--rule)}
  @media(max-width:900px){.sectors{grid-template-columns:repeat(2,1fr)}}
  .sectors .s{padding:28px 0 36px;border-right:1px solid var(--rule-soft);padding-right:24px;padding-left:4px;cursor:pointer;transition:background .2s}
  .sectors .s:last-child{border-right:0}
  .sectors .s:hover{background:rgba(253,209,0,0.05)}
  .sectors .s:hover h3{color:var(--accent-ink)}
  .sectors .s .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em}
  .sectors .s h3{font-family:'Instrument Serif',serif;font-size:26px;line-height:1.1;letter-spacing:-0.01em;font-weight:400;margin:14px 0 10px;transition:color .2s}
  .sectors .s p{font-size:13px;color:var(--ink-2);line-height:1.5;margin:0}
  .sectors .s .companies{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.06em}

  /* Portfolio */
  .pf-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
  .pf-filter button{padding:8px 16px;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;letter-spacing:0.01em;color:var(--ink-2);transition:all .15s;font-family:'JetBrains Mono',monospace}
  .pf-filter button:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
  .pf-filter button.active{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
  .pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
  @media(max-width:900px){.pf-grid{grid-template-columns:repeat(2,1fr)}}
  .pf-card{background:var(--paper);padding:28px 22px 22px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s;cursor:pointer;position:relative;overflow:hidden}
  .pf-card:hover{background:var(--paper-2)}
  .pf-card:hover h4{color:var(--accent-ink)}
  .pf-card h4{transition:color .2s}
  .pf-card .pf-top{display:flex;justify-content:space-between;align-items:flex-start}
  .pf-card .pf-ticker{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
  .pf-card .pf-tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-2);letter-spacing:.06em}
  .pf-card h4{font-family:'Instrument Serif',serif;font-size:26px;line-height:1.05;margin:22px 0 6px;font-weight:400;letter-spacing:-0.01em}
  .pf-card .pf-sector{font-size:12.5px;color:var(--ink-2)}
  .pf-card .pf-meta{display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule-soft);font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.05em}
  .pf-card .pf-status-listed{color:var(--accent-ink)}
  .pf-card .pf-hover{position:absolute;inset:0;background:var(--yellow);color:var(--on-yellow);padding:24px;opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .pf-card:hover .pf-hover{opacity:1}
  .pf-card .pf-hover h4{color:var(--on-yellow);margin-top:0}
  .pf-card .pf-hover p{font-size:13px;line-height:1.5;color:#2A2A27;margin:8px 0 0}
  .pf-card .pf-hover .pf-ticker{color:#5A4410}
  .pf-card .pf-hover .arr{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;font-weight:600}

  /* Team */
  .team{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}
  @media(max-width:900px){.team{grid-template-columns:repeat(2,1fr)}}
  .member{cursor:pointer;transition:transform .2s}
  .member .ph{aspect-ratio:4/5;background-size:cover;background-position:center top;filter:grayscale(0.8) contrast(1.05) brightness(.95);transition:filter .3s,transform .3s;border:1px solid var(--rule)}
  .member:hover .ph{filter:grayscale(0) contrast(1) brightness(1)}
  .member:hover h4{color:var(--accent-ink)}
  .member h4{transition:color .2s}
  .member h4{font-family:'Instrument Serif',serif;font-size:22px;font-weight:400;margin:16px 0 4px;letter-spacing:-0.01em}
  .member .role{font-size:12.5px;color:var(--muted);line-height:1.4}
  .member .bio-open{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent-ink);letter-spacing:.08em;margin-top:10px;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
  .member .bio-open::after{content:"→";transition:transform .15s}
  .member:hover .bio-open::after{transform:translateX(3px)}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px);display:grid;place-items:center;padding:40px}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-body{background:var(--paper-2);max-width:900px;width:100%;max-height:80vh;overflow:auto;display:grid;grid-template-columns:360px 1fr;gap:0;border:1px solid var(--rule)}
  @media(max-width:800px){.modal-body{grid-template-columns:1fr}}
  .modal-body .mph{aspect-ratio:4/5;background-size:cover;background-position:center top}
  .modal-body .mtxt{padding:48px 44px}
  .modal-body .mtxt small{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .modal-body .mtxt h3{font-family:'Instrument Serif',serif;font-size:44px;margin:6px 0 4px;font-weight:400;letter-spacing:-0.015em;color:var(--accent-ink)}
  .modal-body .mtxt .r{font-size:13.5px;color:var(--ink-2)}
  .modal-body .mtxt hr{border:0;border-top:1px solid var(--rule);margin:24px 0}
  .modal-body .mtxt p{font-size:14.5px;line-height:1.65;color:var(--ink-2);margin:0 0 14px}
  .modal-close{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:16px;border:1px solid var(--accent-ink);color:var(--accent-ink)}

  /* Philosophy */
  .philosophy{display:grid;grid-template-columns:1.3fr 2fr;gap:64px}
  @media(max-width:900px){.philosophy{grid-template-columns:1fr}}

function Tweaks({ state, setState, visible }) {
  if (!visible) return null;
  const themes = [
  ["dark", "Dark (default)", "#0F0F0E", "#F5E9C8"],
  ["light", "Sand (light)", "#E8DFCB", "#1A1712"]];

  // Each accent: [id, label, fill (bright), ink-light — always near-black in light]
  const accents = [
  ["#FDD100", "Crest yellow", "#FDD100", "#1A1712"],
  ["#E6A700", "Amber",        "#E6A700", "#1A1712"],
  ["#D86B1C", "Burnt orange", "#D86B1C", "#1A1712"],
  ["#1C3A2E", "Viridian",     "#1C3A2E", "#1C3A2E"],
  ["#4B6A88", "Slate blue",   "#4B6A88", "#2D4560"]];


  const applyTheme = (t) => {
    document.body.classList.toggle("light", t === "light");
  };

  const applyAccent = (entry) => {
    const fill = entry[2], inkLight = entry[3];
    document.documentElement.style.setProperty("--yellow", fill);
    document.documentElement.style.setProperty("--accent", fill);
    // When on sand, use the deep variant for text. When dark, fill IS text-safe.
    const inkForCurrent = document.body.classList.contains("light") ? inkLight : fill;
    document.documentElement.style.setProperty("--accent-ink", inkForCurrent);
    // Stash both so we can switch when theme changes
    document.documentElement.dataset.accentFill = fill;
    document.documentElement.dataset.accentInkLight = inkLight;
  };

  const setKey = (k, v) => {
    const next = { ...state, [k]: v };
    setState(next);
    if (k === "theme") {
      applyTheme(v);
      // Recompute accent-ink to match new theme
      const fill = document.documentElement.dataset.accentFill;
      const inkLight = document.documentElement.dataset.accentInkLight;
      if (fill && inkLight) {
        document.documentElement.style.setProperty("--accent-ink", v === "light" ? inkLight : fill);
      }
      try { localStorage.setItem("asbv_theme", v); } catch(e) {}
    }
    if (k === "accent") {
      const entry = accents.find((a) => a[0] === v);
      if (entry) applyAccent(entry);
    }
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  return (
    <div className="tweaks show">
      <h6>Tweaks</h6>
      <label>Theme
        <div className="swatches">
          {themes.map((t) =>
          <div key={t[0]} title={t[1]}
          className={"sw" + (state.theme === t[0] ? " active" : "")}
          style={{ background: `linear-gradient(135deg, ${t[2]} 0 50%, ${t[3]} 50% 100%)`, borderColor: "var(--rule)" }}
          onClick={() => setKey("theme", t[0])} />
          )}
        </div>
      </label>
      <label>Accent
        <div className="swatches">
          {accents.map((a) =>
          <div key={a[0]} title={a[1]}
          className={"sw" + (state.accent === a[0] ? " active" : "")}
          style={{ background: a[2] }}
          onClick={() => setKey("accent", a[0])} />
          )}
        </div>
      </label>
    </div>);

}

function App() {
  const [member, setMember] = useState(null);
  const [nlOpen, setNlOpen] = useState(false);
  const [tweakState, setTweakState] = useState(() => {
    try {
      const saved = localStorage.getItem("asbv_theme");
      if (saved) return { ...TWEAKS, theme: saved };
    } catch(e) {}
    return TWEAKS;
  });
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [lang, setLangState] = useState(() => {
    try { return localStorage.getItem("asbv_lang") || "en"; } catch(e) { return "en"; }
  });
  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem("asbv_lang", l); } catch(e) {}
  };
  const toggleTheme = () => {
    const next = tweakState.theme === "dark" ? "light" : "dark";
    setTweakState({ ...tweakState, theme: next });
    document.body.classList.toggle("light", next === "light");
    try { localStorage.setItem("asbv_theme", next); } catch(e) {}
  };
  useEffect(() => {
    document.body.classList.toggle("zh", lang === "zh");
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  }, [lang]);
  useEffect(() => {
    document.body.classList.toggle("light", tweakState.theme === "light");
    // Apply persisted accent (from disk/TWEAKS) on mount
    const accent = tweakState.accent;
    if (accent && accent !== "#FDD100") {
      const map = {
        "#FDD100": "#1A1712",
        "#E6A700": "#1A1712",
        "#D86B1C": "#1A1712",
        "#1C3A2E": "#1C3A2E",
        "#4B6A88": "#2D4560",
      };
      const inkLight = map[accent] || accent;
      document.documentElement.style.setProperty("--yellow", accent);
      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty("--accent-ink", tweakState.theme === "light" ? inkLight : accent);
      document.documentElement.dataset.accentFill = accent;
      document.documentElement.dataset.accentInkLight = inkLight;
    }
  }, []);

  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const p = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
      const el = document.getElementById('progress');
      if (el) el.style.width = p + "%";
    };
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {if (e.isIntersecting) e.target.classList.add('in');});
    }, { threshold: 0.08 });
    document.querySelectorAll('.fadein').forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return <LangCtx.Provider value={{ lang, setLang }}>
    <Ticker />
    <Nav onOpenNewsletter={() => setNlOpen(true)} onToggleTheme={toggleTheme} theme={tweakState.theme} />
    <Hero />
    <Numbers />
    <Sectors />
    <Portfolio />
    <Philosophy />
    <Chairman />
    <Team onOpen={setMember} />
    <History />
    <Research />
    <News />
    <Contact />
    <CtaBand />
    <Footer onOpenNewsletter={() => setNlOpen(true)} />
    <TeamModal member={member} onClose={() => setMember(null)} />
    <NewsletterModal open={nlOpen} onClose={() => setNlOpen(false)} />
    <Tweaks state={tweakState} setState={setTweakState} visible={tweaksVisible} />
  </LangCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
